name: Build Markdown to HTML

on:
  push:
    paths:
      - 'index.html'
      - 'blog.html'
      - 'package.json'
      - 'package-lock.json'
      - 'posts/*.md'
      - 'scripts/**'
      - 'tests/**'
      - 'assets/**'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: npm test

      - run: npm run build

      - name: Commit built HTML
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f index.html blog.html posts/*.html sitemap.xml robots.txt
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "build: update HTML from markdown"
            git push
          fi
